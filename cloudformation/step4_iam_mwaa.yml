AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Step 4 of 4 — IAM execution role for MWAA.
  This role is assumed by MWAA workers at runtime. It grants exactly the
  permissions the DAG needs and nothing more:
    - Read DAGs and plugins from the MWAA S3 bucket (Step 3)
    - Read raw ingest files from the raw S3 bucket (Step 1)
    - GetSecretValue on all three pipeline secrets (Step 2)
    - Write logs to CloudWatch
    - Publish to SQS dead letter queue for failed messages
  No broad S3, no admin, no wildcard — least privilege throughout.

# =============================================================================
# Parameters
# =============================================================================

Parameters:

  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

  ProjectName:
    Type: String
    Default: financial-data-quality-pipeline

# =============================================================================
# Resources
# =============================================================================

Resources:

  # ---------------------------------------------------------------------------
  # 1. MWAA execution role
  # ---------------------------------------------------------------------------

  MWAAExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${Environment}-mwaa-execution-role'
      Description: >
        Assumed by MWAA workers. Grants access to S3 DAGs bucket,
        raw ingest bucket, Secrets Manager, CloudWatch, and SQS DLQ.
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - airflow.amazonaws.com
                - airflow-env.amazonaws.com
            Action: sts:AssumeRole

      Policies:

        # ── S3: DAGs bucket ──────────────────────────────────────────────────
        - PolicyName: MWAADagsBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListDagsBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub
                  - 'arn:aws:s3:::${ProjectName}-${Environment}-mwaa-dags'
                  - {}
              - Sid: ReadWriteDagsBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub
                  - 'arn:aws:s3:::${ProjectName}-${Environment}-mwaa-dags/*'
                  - {}

        # ── S3: raw ingest bucket (read only) ────────────────────────────────
        - PolicyName: RawIngestBucketReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListRawBucket
                Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  Fn::ImportValue:
                    !Sub '${ProjectName}-${Environment}-s3-bucket-arn'
              - Sid: ReadRawObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub
                  - '${BucketArn}/*'
                  - BucketArn:
                      Fn::ImportValue:
                        !Sub '${ProjectName}-${Environment}-s3-bucket-arn'

        # ── Secrets Manager: all three pipeline secrets ───────────────────────
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: GetPipelineSecrets
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - Fn::ImportValue:
                      !Sub '${ProjectName}-${Environment}-snowflake-secret-arn'
                  - Fn::ImportValue:
                      !Sub '${ProjectName}-${Environment}-slack-secret-arn'
                  - Fn::ImportValue:
                      !Sub '${ProjectName}-${Environment}-dbt-secret-arn'

        # ── CloudWatch: write logs ────────────────────────────────────────────
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CreateLogGroups
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:GetLogEvents
                  - logs:GetLogRecord
                  - logs:GetLogDelivery
                  - logs:ListLogDeliveries
                  - logs:PutLogDelivery
                  - logs:UpdateLogDelivery
                  - logs:DeleteLogDelivery
                  - logs:DescribeLogGroups
                  - logs:DescribeResourcePolicies
                  - logs:DescribeLogStreams
                  - logs:PutResourcePolicy
                Resource: !Sub 'arn:aws:logs:eu-west-2:${AWS::AccountId}:log-group:airflow-${ProjectName}-*'

        # ── SQS: read pipe status + DLQ visibility ────────────────────────────
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSQSQueueAttributes
                Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                  - sqs:GetQueueUrl
                Resource:
                  - Fn::ImportValue:
                      !Sub '${ProjectName}-${Environment}-sqs-queue-arn'
                  - Fn::ImportValue:
                      !Sub '${ProjectName}-${Environment}-dlq-arn'

        # ── MWAA: allow workers to interact with the environment ──────────────
        - PolicyName: MWAAEnvironmentAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: MWAAPublishMetrics
                Effect: Allow
                Action:
                  - airflow:PublishMetrics
                Resource: !Sub
                  - 'arn:aws:airflow:eu-west-2:${AWS::AccountId}:environment/${ProjectName}-${Environment}'
                  - {}
              - Sid: MWAACreateWebLoginToken
                Effect: Allow
                Action:
                  - airflow:CreateWebLoginToken
                Resource: !Sub
                  - 'arn:aws:airflow:eu-west-2:${AWS::AccountId}:role/${ProjectName}-${Environment}/Admin'
                  - {}

        # ── KMS: decrypt S3 and Secrets Manager if using KMS keys ────────────
        - PolicyName: KMSDecryptAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowKMSDecrypt
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                Resource: '*'
                Condition:
                  StringLike:
                    kms:ViaService:
                      - !Sub 's3.eu-west-2.amazonaws.com'
                      - !Sub 'secretsmanager.eu-west-2.amazonaws.com'

# =============================================================================
# Outputs
# =============================================================================

Outputs:

  MWAAExecutionRoleArn:
    Description: >
      ARN of the MWAA execution role.
      Referenced by Step 3 MWAA environment ExecutionRoleArn.
    Value: !GetAtt MWAAExecutionRole.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-mwaa-execution-role-arn'

  MWAAExecutionRoleName:
    Description: Name of the MWAA execution role
    Value: !Ref MWAAExecutionRole
    Export:
      Name: !Sub '${ProjectName}-${Environment}-mwaa-execution-role-name'