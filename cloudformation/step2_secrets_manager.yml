AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Step 2 of 4 — Secrets Manager.
  Stores all credentials the MWAA DAG needs at runtime:
    - Snowflake connection (account, user, password, database, warehouse, role)
    - Slack webhook URL (for quarantine alerts)
    - dbt Cloud API token + job ID (for triggering dbt runs)
  MWAA workers read these at runtime via boto3 — nothing is hardcoded
  in DAG code or environment variables.

# =============================================================================
# Parameters
# =============================================================================

Parameters:

  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

  ProjectName:
    Type: String
    Default: financial-data-quality-pipeline

  # Snowflake credentials
  SnowflakeAccount:
    Type: String
    Description: >
      Snowflake account identifier.
      Format: <orgname>-<account_name>  e.g. myorg-myaccount
      Find in Snowflake: SELECT CURRENT_ACCOUNT();

  SnowflakeUser:
    Type: String
    Description: Snowflake service user for the pipeline (not a personal login)

  SnowflakePassword:
    Type: String
    NoEcho: true
    Description: Password for the Snowflake service user

  SnowflakeDatabase:
    Type: String
    Default: FINANCIAL_DATA
    Description: Snowflake database name (created by DCM)

  SnowflakeWarehouse:
    Type: String
    Default: PIPELINE_WH
    Description: Snowflake warehouse for pipeline workloads (created by DCM)

  SnowflakeRole:
    Type: String
    Default: PIPELINE_ROLE
    Description: Snowflake role the pipeline assumes (created by DCM)

  # Slack
  SlackWebhookUrl:
    Type: String
    NoEcho: true
    Description: >
      Slack incoming webhook URL for quarantine alerts.
      Create at: https://api.slack.com/apps > Incoming Webhooks
      Format: https://hooks.slack.com/services/T.../B.../...

  # dbt Cloud
  DbtCloudApiToken:
    Type: String
    NoEcho: true
    Description: >
      dbt Cloud API service token.
      Create at: dbt Cloud > Account Settings > Service Tokens
      Needs: Jobs > Trigger permission on the target project.

  DbtCloudAccountId:
    Type: String
    Description: dbt Cloud account ID (visible in the URL when logged in)

  DbtCloudJobId:
    Type: String
    Description: >
      dbt Cloud job ID for the nightly financial transactions run.
      Find at: dbt Cloud > Jobs > select job > URL contains the ID.

# =============================================================================
# Resources
# =============================================================================

Resources:

  # ---------------------------------------------------------------------------
  # 1. Snowflake connection secret
  # Stored as a JSON object so the DAG can fetch all fields in one API call.
  # ---------------------------------------------------------------------------

  SnowflakeConnectionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/snowflake/connection'
      Description: Snowflake connection credentials for the MWAA pipeline DAG
      SecretString: !Sub |
        {
          "account":   "${SnowflakeAccount}",
          "user":      "${SnowflakeUser}",
          "password":  "${SnowflakePassword}",
          "database":  "${SnowflakeDatabase}",
          "warehouse": "${SnowflakeWarehouse}",
          "role":      "${SnowflakeRole}",
          "schema":    "RAW"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # Rotation is not enabled for Snowflake — rotate manually via DCM
  # when the service user password changes. Add a rotation Lambda here
  # if your security policy requires automated rotation.

  # ---------------------------------------------------------------------------
  # 2. Slack webhook secret
  # Stored as a plain string — the DAG reads it directly as a URL.
  # ---------------------------------------------------------------------------

  SlackWebhookSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/slack/webhook-url'
      Description: Slack incoming webhook URL for data quality quarantine alerts
      SecretString: !Ref SlackWebhookUrl
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # 3. dbt Cloud credentials secret
  # Stored as JSON — token, account ID, and job ID together.
  # ---------------------------------------------------------------------------

  DbtCloudSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '/${ProjectName}/${Environment}/dbt-cloud/credentials'
      Description: dbt Cloud API credentials for triggering nightly job runs
      SecretString: !Sub |
        {
          "api_token":  "${DbtCloudApiToken}",
          "account_id": "${DbtCloudAccountId}",
          "job_id":     "${DbtCloudJobId}"
        }
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # ---------------------------------------------------------------------------
  # 4. Resource policy on each secret
  # Restricts access to the MWAA execution role only (defined in Step 4).
  # Cross-references Step 4 output via ImportValue.
  # ---------------------------------------------------------------------------

  SnowflakeSecretResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref SnowflakeConnectionSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowMWAAExecutionRoleOnly
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: '*'
            Condition:
              StringEquals:
                aws:PrincipalTag/Project: !Ref ProjectName

  SlackSecretResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref SlackWebhookSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowMWAAExecutionRoleOnly
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: '*'
            Condition:
              StringEquals:
                aws:PrincipalTag/Project: !Ref ProjectName

  DbtCloudSecretResourcePolicy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId: !Ref DbtCloudSecret
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowMWAAExecutionRoleOnly
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action:
              - secretsmanager:GetSecretValue
              - secretsmanager:DescribeSecret
            Resource: '*'
            Condition:
              StringEquals:
                aws:PrincipalTag/Project: !Ref ProjectName

# =============================================================================
# Outputs — consumed by Step 3 (MWAA) and Step 4 (IAM)
# =============================================================================

Outputs:

  SnowflakeSecretArn:
    Description: ARN of the Snowflake connection secret
    Value: !Ref SnowflakeConnectionSecret
    Export:
      Name: !Sub '${ProjectName}-${Environment}-snowflake-secret-arn'

  SnowflakeSecretName:
    Description: >
      Secret name for use in DAG code:
      boto3 client.get_secret_value(SecretId=<this value>)
    Value: !Sub '/${ProjectName}/${Environment}/snowflake/connection'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-snowflake-secret-name'

  SlackSecretArn:
    Description: ARN of the Slack webhook secret
    Value: !Ref SlackWebhookSecret
    Export:
      Name: !Sub '${ProjectName}-${Environment}-slack-secret-arn'

  SlackSecretName:
    Description: Secret name for use in DAG code
    Value: !Sub '/${ProjectName}/${Environment}/slack/webhook-url'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-slack-secret-name'

  DbtCloudSecretArn:
    Description: ARN of the dbt Cloud credentials secret
    Value: !Ref DbtCloudSecret
    Export:
      Name: !Sub '${ProjectName}-${Environment}-dbt-secret-arn'

  DbtCloudSecretName:
    Description: Secret name for use in DAG code
    Value: !Sub '/${ProjectName}/${Environment}/dbt-cloud/credentials'
    Export:
      Name: !Sub '${ProjectName}-${Environment}-dbt-secret-name'