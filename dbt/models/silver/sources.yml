# dbt/models/silver/sources.yml
# Source definitions and freshness checks for the BRONZE layer.

version: 2

sources:
  - name: bronze
    database: FINANCIAL_DATA
    schema: BRONZE
    description: >
      Raw transaction data ingested via Snowpipe from S3.
      Freshness measured by ingested_at timestamp.

    tables:
      - name: financial_transactions
        description: >
          One row per financial transaction event.
          Snowpipe auto-ingests new .parquet files from S3 hourly.
        config:
          loaded_at_field: ingested_at
          freshness:
            warn_after:
              count: 2
              period: hour
            error_after:
              count: 24
              period: hour