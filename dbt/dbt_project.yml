name: financial_data_quality
version: '1.0.0'
config-version: 2

profile: financial_data_quality

model-paths:   ["models"]
analysis-paths: ["analyses"]
test-paths:    ["tests"]
seed-paths:    ["seeds"]
macro-paths:   ["macros"]
snapshot-paths: ["snapshots"]

target-path:   "target"
clean-targets: ["target", "dbt_packages"]

models:
  financial_data_quality:

    raw:
      +schema:       RAW
      +materialized: view
      +tags:         ["raw", "nightly"]

    serving:
      +schema:       SERVING
      +materialized: table
      +tags:         ["serving", "nightly"]
      +post-hook:
        - "ALTER TABLE {{ this }} CLUSTER BY (transaction_date)"

vars:
  database: FINANCIAL_DATA