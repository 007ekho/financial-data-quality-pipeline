dataset: snowflake_bronze/BRONZE/FINANCIAL_TRANSACTIONS

columns:
  - name: TRANSACTION_ID
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0
      - duplicate:
          threshold:
            must_be: 0

  - name: ACCOUNT_ID
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: COUNTERPARTY_ID
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: TRANSACTION_TYPE
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0
      - invalid:
          valid_values: [PAYMENT, TRANSFER, REFUND]
          threshold:
            must_be: 0

  - name: AMOUNT
    data_type: float
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: CURRENCY
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: STATUS
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0
      - invalid:
          valid_values: [COMPLETED, PENDING, FAILED, REVERSED]
          threshold:
            must_be: 0

  - name: CHANNEL
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0
      - invalid:
          valid_values: [MOBILE, WEB, ATM, BRANCH, API]
          threshold:
            must_be: 0

  - name: MERCHANT_CATEGORY
    data_type: varchar

  - name: INITIATED_AT
    data_type: timestamp_ntz
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: SETTLED_AT
    data_type: timestamp_ntz

  - name: IS_FLAGGED
    data_type: boolean
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: FLAG_REASON
    data_type: varchar

  - name: SOURCE_SYSTEM
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0
      - invalid:
          valid_values: [CORE_BANKING_v2]
          threshold:
            must_be: 0

  - name: INGESTED_AT
    data_type: timestamp_ntz
    checks:
      - missing:
          threshold:
            must_be: 0

