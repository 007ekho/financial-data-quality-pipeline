# contracts/gold/fct_financial_transactions.yml
# Soda Core 4.x data contract for GOLD.FCT_FINANCIAL_TRANSACTIONS

dataset: snowflake_gold/GOLD/FCT_FINANCIAL_TRANSACTIONS

columns:
  - name: transaction_id
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0
      - duplicate:
          threshold:
            must_be: 0

  - name: amount_gbp
    data_type: float
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: transaction_date
    data_type: date
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: amount_bucket
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0
      - invalid:
          valid_values: [REFUND, MICRO, SMALL, MEDIUM, LARGE, WHALE]
          threshold:
            must_be: 0

  - name: hour_of_day
    data_type: integer
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: settlement_hours
    data_type: float

  - name: loaded_at
    data_type: timestamp
    checks:
      - missing:
          threshold:
            must_be: 0