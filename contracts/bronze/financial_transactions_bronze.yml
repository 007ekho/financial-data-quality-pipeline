# contracts/bronze/financial_transactions_bronze.yml
# Soda Core 4.x data contract for BRONZE.FINANCIAL_TRANSACTIONS

dataset: snowflake_bronze/BRONZE/FINANCIAL_TRANSACTIONS

columns:
  - name: transaction_id
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0
      - duplicate:
          threshold:
            must_be: 0

  - name: account_id
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: counterparty_id
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: transaction_type
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0
      - invalid:
          valid_values: [PAYMENT, TRANSFER, REFUND]
          threshold:
            must_be: 0

  - name: amount
    data_type: float
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: currency
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: status
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0
      - invalid:
          valid_values: [COMPLETED, PENDING, FAILED, REVERSED]
          threshold:
            must_be: 0

  - name: channel
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0
      - invalid:
          valid_values: [MOBILE, WEB, ATM, BRANCH, API]
          threshold:
            must_be: 0

  - name: merchant_category
    data_type: varchar

  - name: initiated_at
    data_type: timestamp_ntz
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: settled_at
    data_type: timestamp_ntz

  - name: is_flagged
    data_type: boolean
    checks:
      - missing:
          threshold:
            must_be: 0

  - name: flag_reason
    data_type: varchar

  - name: source_system
    data_type: varchar
    checks:
      - missing:
          threshold:
            must_be: 0
      - invalid:
          valid_values: [CORE_BANKING_v2]
          threshold:
            must_be: 0

  - name: ingested_at
    data_type: timestamp_ntz
    checks:
      - missing:
          threshold:
            must_be: 0