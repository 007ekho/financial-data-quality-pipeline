# soda/configuration_ci.yml
# Used by GitHub Actions CI gate only — never by the production MWAA DAG.
# Points at RAW_CI and SERVING_CI schemas so CI never touches prod data.
# Secrets injected as environment variables from GitHub Actions secrets.

data_sources:
  snowflake_bronze:
    type: snowflake
    account:    ${SNOWFLAKE_ACCOUNT}
    user:       ${SNOWFLAKE_USER}
    password:   ${SNOWFLAKE_PASSWORD}
    database:   ${SNOWFLAKE_DATABASE}
    warehouse:  ${SNOWFLAKE_WAREHOUSE}
    schema:     BRONZE_CI
    role:       SODA_CI_ROLE
    session_parameters:
      QUERY_TAG: "soda-ci-check"

  snowflake_gold:
    type: snowflake
    account:    ${SNOWFLAKE_ACCOUNT}
    user:       ${SNOWFLAKE_USER}
    password:   ${SNOWFLAKE_PASSWORD}
    database:   ${SNOWFLAKE_DATABASE}
    warehouse:  ${SNOWFLAKE_WAREHOUSE}
    schema:     GOLD_CI
    role:       SODA_CI_ROLE
    session_parameters:
      QUERY_TAG: "soda-ci-check"