# .github/workflows/data_quality_ci.yml
# CI gate — runs on every PR touching contracts or dbt models
# Blocks merge if SodaCL contracts fail against staging data
#
# What it protects against:
#   - A contract rule change that would quarantine valid production data
#   - A dbt model change that breaks the SERVING Soda contract
#   - Schema drift introduced by a new dbt column or type change
#
# It does NOT run on the nightly data schedule — only on code changes.

name: Data quality CI gate

on:
  pull_request:
    paths:
      - "contracts/**"
      - "dbt/models/**"
      - "dbt/dbt_project.yml"
      - "soda/**"

env:
  SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_CI_USER }}
  SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_CI_PASSWORD }}
  SNOWFLAKE_DATABASE:  ${{ secrets.SNOWFLAKE_DATABASE }}
  SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_CI_WAREHOUSE }}

jobs:
  data-quality-ci:
    name: Soda contracts + dbt slim CI (staging)
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Soda Core and dbt
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "soda-core==4.7.0" "soda-snowflake==4.7.0" "dbt-snowflake>=1.7"
          python3 -c "from soda.scan import Scan; print('Soda installed successfully')"

      - name: Soda BRONZE contract scan (staging)
        run: |
          python3 ci/run_soda_scan.py \
            snowflake_bronze \
            soda/configuration_ci.yml \
            contracts/bronze/financial_transactions_bronze.yml \
            ci-bronze
        env:
          SNOWFLAKE_SCHEMA: BRONZE_CI

      - name: Download production manifest for slim CI
        run: |
          mkdir -p ./target
          aws s3 cp s3://${{ secrets.ARTIFACTS_BUCKET }}/dbt/manifest.json ./target/manifest.json
        env:
          AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_CI_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_CI_SECRET_KEY }}
          AWS_REGION:            eu-west-2

      - name: dbt run — changed models only
        working-directory: dbt
        run: |
          dbt run \
            --select "state:modified+" \
            --defer \
            --state ../target \
            --target ci
        env:
          DBT_TARGET: ci
          SNOWFLAKE_SCHEMA: GOLD_CI

      - name: dbt test — changed models only
        working-directory: dbt
        run: |
          dbt test \
            --select "state:modified+" \
            --defer \
            --state ../target \
            --target ci
        env:
          DBT_TARGET: ci
          SNOWFLAKE_SCHEMA: GOLD_CI

      - name: Soda GOLD contract scan (staging)
        run: |
          python3 ci/run_soda_scan.py \
            snowflake_gold \
            soda/configuration_ci.yml \
            contracts/gold/fct_financial_transactions.yml \
            ci-gold
        env:
          SNOWFLAKE_SCHEMA: GOLD_CI

      - name: Post Soda results to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body;
            try {
              const results = JSON.parse(
                fs.readFileSync('.soda/scan-results.json', 'utf8')
              );
              const failed  = results.checks.filter(c => c.outcome === 'fail');
              const warned  = results.checks.filter(c => c.outcome === 'warn');
              const passed  = results.checks.filter(c => c.outcome === 'pass');
              if (failed.length === 0) {
                body = [
                  `### Soda data quality — all checks passed`,
                  `| Result | Count |`,
                  `|--------|-------|`,
                  `| Passed | ${passed.length} |`,
                  `| Warned | ${warned.length} |`,
                  `| Failed | 0 |`,
                  warned.length > 0
                    ? `\n**Warnings:**\n` + warned.map(c => `- \`${c.name}\``).join('\n')
                    : ''
                ].join('\n');
              } else {
                body = [
                  `### Soda data quality — ${failed.length} check(s) failed`,
                  `Merge is blocked until all contracts pass.`,
                  `\n**Failed checks:**`,
                  failed.map(c => `- \`${c.name}\``).join('\n'),
                  warned.length > 0
                    ? `\n**Warnings:**\n` + warned.map(c => `- \`${c.name}\``).join('\n')
                    : ''
                ].join('\n');
              }
            } catch (e) {
              body = `### Soda scan results unavailable\nCheck the Actions log for details.`;
            }
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              body
            });